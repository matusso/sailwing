# Tests and builds the static site.
# Deployment is done by Cloudflare's Git integration (Workers Builds), which runs
# `npx wrangler deploy` on pushes to main (https://sailwing.burso.eu) and uploads
# preview versions for other branches.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
